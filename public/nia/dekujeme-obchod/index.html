<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/nia/favicon.svg?v=2" type="image/svg+xml">
<title>Děkujeme za nákup — Nia Dobyšar</title>
<script src="/nia/google-ads.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--black:#080606;--burgundy3:#5c2a3e;--burgundy-glow:#9e4d6a;--display:'Bodoni Moda',Georgia,serif;--b:'Outfit',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:var(--black);color:#fff;font-family:var(--b);font-weight:300;padding:24px;text-align:center}
.panel{max-width:560px}
.eyebrow{font-size:.62rem;letter-spacing:.48em;text-transform:uppercase;color:rgba(158,77,106,.9);margin-bottom:18px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(2rem,6vw,2.8rem);letter-spacing:.04em;text-transform:uppercase;line-height:1.15;margin-bottom:16px}
p{color:rgba(255,255,255,.72);line-height:1.75;margin-bottom:28px}
a{display:inline-block;background:var(--burgundy3);color:#fff;text-decoration:none;font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;padding:16px 28px;border-radius:999px;margin:6px}
a:hover{background:var(--burgundy-glow)}
a.secondary{background:transparent;border:1px solid rgba(255,255,255,.25)}
.loading{color:rgba(255,255,255,.55)}
</style>
</head>
<body>
  <div class="panel">
    <p class="eyebrow" id="eyebrow">Platba proběhla ✦</p>
    <h1 id="title">Děkujeme</h1>
    <p id="message" class="loading">Ověřujeme platbu a připravujeme odkaz ke stažení…</p>
    <div id="actions" hidden>
      <a href="#" id="downloadBtn">Stáhnout soubor</a>
      <a href="/nia/obchod" class="secondary">Zpět do obchodu</a>
    </div>
    <a href="/nia/" id="homeLink" hidden class="secondary">Zpět na web</a>
  </div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var sid=params.get('session_id');
  var eyebrow=document.getElementById('eyebrow');
  var title=document.getElementById('title');
  var message=document.getElementById('message');
  var actions=document.getElementById('actions');
  var downloadBtn=document.getElementById('downloadBtn');
  var homeLink=document.getElementById('homeLink');

  if(!sid){
    message.textContent='Chybí potvrzení platby. Zkontroluj e-mail — pokud platba proběhla, odkaz ke stažení ti přijde do schránky.';
    homeLink.hidden=false;
    return;
  }

  function poll(attempt){
    fetch('/api/nia/shop/order?session_id='+encodeURIComponent(sid),{cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.ok&&d.status==='paid'&&d.downloadUrl){
          title.textContent='Hotovo';
          message.innerHTML='Nákup <strong>'+(d.productName||'produktu')+'</strong> je potvrzený. Odkaz jsme poslali i na e-mail.';
          downloadBtn.href=d.downloadUrl;
          actions.hidden=false;
          homeLink.hidden=false;
          if(d.invoiceUrl){
            var inv=document.createElement('p');
            inv.style.marginTop='12px';
            inv.innerHTML='Faktura: <a href="'+d.invoiceUrl+'" style="color:#fff">otevřít</a>';
            message.parentNode.insertBefore(inv, actions);
          }
          return;
        }
        if(d.ok&&d.pending&&attempt<12){
          setTimeout(function(){poll(attempt+1);},2500);
          return;
        }
        message.textContent='Platba se zpracovává. Odkaz ke stažení ti přijde e-mailem během pár minut.';
        homeLink.hidden=false;
      })
      .catch(function(){
        message.textContent='Nepodařilo se načíst stav objednávky. Zkontroluj e-mail s odkazem ke stažení.';
        homeLink.hidden=false;
      });
  }
  poll(0);
})();
</script>
<script src="/nia/cookie-bar.js" defer></script>
</body>
</html>
