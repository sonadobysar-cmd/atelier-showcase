<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Administrace | Vini d’Elite</title>
  <link rel="icon" href="favicon.svg">
  <style>
    :root{--wine:#481222;--wine-dark:#260811;--paper:#f7f3ec;--white:#fff;--ink:#211a1c;--muted:#756a6d;--gold:#a77c31;--gold-soft:#eadfc8;--line:#e4ddd3;--ok:#37704b;--err:#a13f4c;--shadow:0 18px 55px rgba(43,20,25,.09)}
    *{box-sizing:border-box}html{color-scheme:light}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1240px,calc(100% - 34px));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top-in{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{color:var(--wine);font-family:Georgia,serif;font-size:1.18rem;letter-spacing:.17em;text-decoration:none;text-transform:uppercase}.actions{display:flex;gap:8px}.btn{border:1px solid #d7ccc4;border-radius:10px;background:var(--white);color:var(--wine);padding:10px 16px;text-decoration:none;letter-spacing:.02em;font-weight:650}.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--wine);color:#fff;border-color:var(--wine);box-shadow:0 10px 22px rgba(72,18,34,.16)}.btn:disabled{opacity:.52;cursor:wait}.login{width:min(460px,calc(100% - 28px));margin:10vh auto 0;padding:clamp(28px,5vw,46px);border:1px solid var(--line);border-radius:22px;background:var(--white);box-shadow:var(--shadow)}.login-mark{display:grid;place-items:center;width:54px;height:54px;border-radius:14px;background:var(--wine);color:#e5cc91;font:700 1.45rem Georgia,serif;margin-bottom:25px}.login h1{font:400 2.25rem/1.1 Georgia,serif;margin:0 0 10px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:18px 0}.field label,.section-label{font-size:.69rem;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:var(--gold)}input,textarea{width:100%;border:1px solid #d9d0ca;background:#fff;color:var(--ink);padding:12px 13px;border-radius:10px;outline:none}input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(167,124,49,.11)}textarea{min-height:125px;resize:vertical}.login .btn{width:100%;margin-top:8px;padding:13px}.app{padding:32px 0 90px}.intro{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:25px}.intro h1{font:400 clamp(1.8rem,4vw,2.8rem)/1.1 Georgia,serif;margin:4px 0 0}.live{display:inline-flex;align-items:center;gap:8px;margin-top:8px;color:var(--ok);font-size:.83rem}.live:before{content:"";width:8px;height:8px;border-radius:99px;background:#55a66d;box-shadow:0 0 0 4px #e4f1e8}.workspace{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}.side{position:sticky;top:94px;border:1px solid var(--line);border-radius:16px;background:var(--white);padding:10px;box-shadow:0 12px 40px rgba(43,20,25,.04)}.side-title{padding:10px 11px 7px;color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.tabs{display:grid;gap:5px}.tab{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;border:0;border-radius:11px;background:transparent;color:var(--ink);padding:10px}.tab:hover{background:#f7f2ec}.tab[aria-selected=true]{color:var(--wine);background:#f1e8e4;font-weight:700}.tab-no{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#f3ede8;color:var(--gold);font-size:.73rem}.tab[aria-selected=true] .tab-no{background:var(--wine);color:#fff}.tab small{display:block;color:var(--muted);font-size:.72rem;font-weight:400;margin-top:1px}.content-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:2px 2px 17px}.content-head h2{font:400 1.55rem Georgia,serif;margin:0}.content-head p{margin:4px 0 0;color:var(--muted);font-size:.87rem}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:15px;background:var(--white);padding:19px;box-shadow:0 8px 28px rgba(43,20,25,.035)}.card h2{font:600 1rem/1.35 Georgia,serif;color:var(--wine);margin:0 0 5px}.card .field{margin:10px 0 0}.full{grid-column:1/-1}.photo{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}.photo img{width:150px;height:150px;object-fit:cover;border:1px solid var(--line);border-radius:12px;background:#eee}.photo input[readonly]{color:var(--muted);font-size:.8rem;margin-bottom:9px}.photo input[type=file]{padding:9px;background:#faf8f5}.photo .muted{font-size:.78rem;margin:8px 0 0}.status{min-height:22px;margin:0;color:var(--muted);font-size:.86rem}.status.ok{color:var(--ok)}.status.error{color:var(--err)}.savebar{position:sticky;z-index:15;bottom:15px;display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:20px;padding:12px;border:1px solid #dacfc8;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.noscript{margin:30px;padding:20px;background:#f8d6d9;color:#711d2c}.hidden{display:none!important}
    @media(max-width:820px){.workspace{grid-template-columns:1fr}.side{position:static}.tabs{grid-template-columns:repeat(3,1fr)}.tab{grid-template-columns:1fr;text-align:center;justify-items:center;padding:9px 5px}.tab small{display:none}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
    @media(max-width:600px){.shell{width:min(100% - 22px,1240px)}.top-in{min-height:62px}.brand{font-size:.9rem}.actions .btn{padding:8px 10px;font-size:.78rem}.actions a{display:none}.app{padding-top:22px}.intro{align-items:flex-start;flex-direction:column;margin-bottom:18px}.intro .muted{margin:0}.photo{grid-template-columns:1fr}.photo img{width:100%;height:220px}.savebar{align-items:stretch;flex-direction:column-reverse}.savebar .btn{width:100%}.status{text-align:center}}
  </style>
</head>
<body>
  <noscript><div class="noscript">Pro bezpečnou administraci je potřeba JavaScript.</div></noscript>
  <section class="login" id="login" hidden>
    <div class="login-mark" aria-hidden="true">V</div><span class="section-label">Vini d’Elite</span><h1>Správa webu</h1><p class="muted">Jednoduchá úprava textů, fotografií a právních dokumentů.</p>
    <form id="loginForm"><div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" value="info@vinidelite.cz" autocomplete="username" required></div><div class="field"><label for="loginPassword">Heslo</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn primary" id="loginButton">Přihlásit se</button><p class="status" id="loginStatus" role="status"></p></form>
  </section>
  <div id="app" hidden>
    <header class="top"><div class="shell top-in"><a class="brand" href="/" target="_blank" rel="noopener">Vini d’Elite · Admin</a><div class="actions"><a class="btn" href="/" target="_blank" rel="noopener">Zobrazit web</a><button type="button" class="btn" id="logout">Odhlásit</button></div></div></header>
    <main class="shell app"><div class="intro"><div><span class="section-label">Přehled</span><h1>Správa obsahu</h1><span class="live">Web je online</span></div><p class="muted">Vyberte sekci, upravte obsah a potvrďte jedním tlačítkem.</p></div>
      <div class="workspace">
        <aside class="side"><div class="side-title">Co chcete upravit?</div><div class="tabs" role="tablist"><button type="button" class="tab" aria-selected="true" data-tab="texts"><span class="tab-no">01</span><span>Texty webu<small>Nadpisy a popisy</small></span></button><button type="button" class="tab" aria-selected="false" data-tab="photos"><span class="tab-no">02</span><span>Fotografie<small>Nahrání a náhledy</small></span></button><button type="button" class="tab" aria-selected="false" data-tab="legal"><span class="tab-no">03</span><span>GDPR a OP<small>Právní dokumenty</small></span></button></div></aside>
        <div class="content"><div class="content-head"><div><h2 id="sectionTitle">Texty webu</h2><p id="sectionHelp">Změňte text přímo v příslušném poli.</p></div></div>
          <section class="panel active" data-panel="texts"><div class="grid" id="textGrid"></div></section>
          <section class="panel" data-panel="photos"><div class="grid" id="photoGrid"></div></section>
          <section class="panel" data-panel="legal"><div class="grid" id="legalGrid"></div></section>
          <div class="savebar"><span class="status" id="saveStatus" role="status" aria-live="polite"></span><button type="button" class="btn primary" id="save">Uložit a publikovat</button></div>
        </div>
      </div>
    </main>
  </div>
  <script>
  (function(){"use strict";
    var state=null,csrf="",dirty=false;
    var labels={
      "home.finderIntro":"Domů · úvod Najdi své víno","home.collectionIntro":"Domů · úvod kolekce","home.wineriesIntro":"Domů · úvod vinařství","home.regionsIntro":"Domů · úvod regionů","home.aboutTitle":"Domů · nadpis O konceptu","home.aboutLead":"Domů · úvod O konceptu","b2b.heroTitle":"B2B · hlavní nadpis","b2b.heroLead":"B2B · hlavní text","b2b.contactLead":"B2B · text u formuláře","prive.membershipIntro":"Privé · vysvětlení členství","prive.joinLead":"Privé · závěrečná výzva",
      "home.founder":"Domů · fotografie zakladatele","b2b.hero":"B2B · hlavní fotografie","prive.founder":"Privé · fotografie zakladatele",
      "wine.1":"Víno · San Lorenzo","wine.2":"Víno · La Cappelletta","wine.3":"Víno · Barbera d’Asti","wine.4":"Víno · Grignolino","wine.5":"Víno · Dolcetto","wine.6":"Víno · Freisa d’Asti","wine.7":"Víno · Cisterna d’Asti","wine.8":"Víno · Bric du Sivu","wine.9":"Víno · Mini Fior","wine.12":"Víno · Bonarda","wine.13":"Víno · Sant’Antonio","wine.14":"Víno · Santa Dorotea",
      gdpr:"Ochrana osobních údajů (GDPR)",terms:"Obchodní podmínky",cookies:"Zásady cookies",complaints:"Reklamační řád",shipping:"Doprava a předání"};
    var login=document.getElementById("login"),app=document.getElementById("app"),loginStatus=document.getElementById("loginStatus"),saveStatus=document.getElementById("saveStatus");
    function status(node,message,type){node.textContent=message||"";node.className="status"+(type?" "+type:"");}
    function request(url,options){options=options||{};options.credentials="same-origin";options.headers=Object.assign({Accept:"application/json"},options.headers||{});return fetch(url,options).then(function(response){return response.json().catch(function(){return{};}).then(function(data){if(!response.ok)throw new Error(data.error||"Požadavek se nepodařil.");return data;});});}
    function showLogin(){app.hidden=true;login.hidden=false;document.getElementById("loginPassword").focus();}
    function showApp(){login.hidden=true;app.hidden=false;}
    function textarea(key,value,legal){var card=document.createElement("article"),h=document.createElement("h2"),field=document.createElement("div"),area=document.createElement("textarea");card.className="card"+(legal?" full":"");h.textContent=labels[key]||key;field.className="field";area.value=value||"";area.rows=legal?14:6;area.dataset.key=key;area.dataset.group=legal?"legal":"texts";area.addEventListener("input",function(){state[this.dataset.group][this.dataset.key]=this.value;dirty=true;status(saveStatus,"Neuložené změny","");});field.appendChild(area);card.appendChild(h);card.appendChild(field);return card;}
    function render(){document.getElementById("textGrid").textContent="";document.getElementById("legalGrid").textContent="";document.getElementById("photoGrid").textContent="";Object.keys(state.texts).forEach(function(key){document.getElementById("textGrid").appendChild(textarea(key,state.texts[key],false));});Object.keys(state.legal).forEach(function(key){document.getElementById("legalGrid").appendChild(textarea(key,state.legal[key],true));});Object.keys(state.images).forEach(function(key){var card=document.createElement("article"),h=document.createElement("h2"),wrap=document.createElement("div"),img=document.createElement("img"),controls=document.createElement("div"),url=document.createElement("input"),file=document.createElement("input"),note=document.createElement("p");card.className="card full";wrap.className="photo";h.textContent=labels[key]||key;img.src=state.images[key];img.alt="Náhled";url.value=state.images[key];url.readOnly=true;file.type="file";file.accept="image/jpeg,image/png,image/webp";note.className="muted";note.textContent="JPG, PNG nebo WebP · nejvýše 8 MB. SVG není kvůli bezpečnosti povoleno.";file.addEventListener("change",function(){var selected=this.files&&this.files[0];if(!selected)return;upload(key,selected,file,img,url);});controls.appendChild(url);controls.appendChild(file);controls.appendChild(note);wrap.appendChild(img);wrap.appendChild(controls);card.appendChild(h);card.appendChild(wrap);document.getElementById("photoGrid").appendChild(card);});dirty=false;status(saveStatus,"Obsah načten","ok");}
    function load(){return request("/api/vini/admin/content").then(function(data){state=data.content;csrf=data.csrf;render();showApp();});}
    function upload(key,file,input,img,url){input.disabled=true;status(saveStatus,"Fotografii bezpečně nahrávám…","");var form=new FormData();form.append("file",file);request("/api/vini/admin/upload",{method:"POST",headers:{"X-Vini-CSRF":csrf},body:form}).then(function(data){state.images[key]=data.url;img.src=data.url;url.value=data.url;dirty=true;status(saveStatus,"Fotografie nahrána. Ještě uložte a publikujte změny.","ok");}).catch(function(error){status(saveStatus,error.message,"error");}).finally(function(){input.disabled=false;input.value="";});}
    document.getElementById("loginForm").addEventListener("submit",function(event){event.preventDefault();var button=document.getElementById("loginButton");button.disabled=true;status(loginStatus,"Ověřuji…","");request("/api/vini/admin/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("loginEmail").value,password:document.getElementById("loginPassword").value})}).then(function(data){csrf=data.csrf;document.getElementById("loginPassword").value="";return load();}).catch(function(error){status(loginStatus,error.message,"error");}).finally(function(){button.disabled=false;});});
    document.getElementById("save").addEventListener("click",function(){var button=this;button.disabled=true;status(saveStatus,"Ukládám a publikuji…","");request("/api/vini/admin/content",{method:"PUT",headers:{"Content-Type":"application/json","X-Vini-CSRF":csrf},body:JSON.stringify(state)}).then(function(data){state=data.content;dirty=false;status(saveStatus,"Uloženo a publikováno · "+new Date(state.updatedAt).toLocaleString("cs-CZ"),"ok");}).catch(function(error){status(saveStatus,error.message,"error");}).finally(function(){button.disabled=false;});});
    document.getElementById("logout").addEventListener("click",function(){request("/api/vini/admin/session",{method:"DELETE"}).finally(showLogin);});
    document.querySelectorAll(".tab").forEach(function(tab){tab.addEventListener("click",function(){var meta={texts:["Texty webu","Změňte text přímo v příslušném poli."],photos:["Fotografie","Vyberte fotografii, zkontrolujte náhled a změny publikujte."],legal:["GDPR a obchodní podmínky","Právní texty jsou editovatelné; jejich finální znění má ověřit právník."]};document.querySelectorAll(".tab").forEach(function(item){item.setAttribute("aria-selected","false");});document.querySelectorAll(".panel").forEach(function(panel){panel.classList.remove("active");});this.setAttribute("aria-selected","true");document.querySelector('[data-panel="'+this.dataset.tab+'"]').classList.add("active");document.getElementById("sectionTitle").textContent=meta[this.dataset.tab][0];document.getElementById("sectionHelp").textContent=meta[this.dataset.tab][1];window.scrollTo({top:0,behavior:"smooth"});});});
    window.addEventListener("beforeunload",function(event){if(dirty){event.preventDefault();event.returnValue="";}});
    request("/api/vini/admin/session").then(function(data){csrf=data.csrf;return load();}).catch(showLogin);
  })();
  </script>
</body></html>
