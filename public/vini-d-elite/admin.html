<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Administrace | Vini d’Elite</title>
  <link rel="icon" href="favicon.svg">
  <style>
    :root{--bg:#17060a;--panel:#260b12;--panel2:#310e16;--parch:#f2e7ce;--mut:#c9b994;--gold:#d8bd7c;--line:rgba(216,189,124,.27);--ok:#bdd69d;--err:#f0a7a7}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 10%,#42141d,transparent 34%),var(--bg);color:var(--parch);font:16px/1.55 Georgia,serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:10;background:rgba(23,6,10,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top-in{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{color:var(--gold);font-size:1.25rem;letter-spacing:.19em;text-transform:uppercase}.actions{display:flex;gap:10px}.btn{border:1px solid var(--gold);background:transparent;color:var(--parch);padding:11px 17px;letter-spacing:.08em}.btn.primary{background:linear-gradient(120deg,#a77d34,#e0c682,#a77d34);color:#21070c;border:0;font-weight:700}.btn:disabled{opacity:.52;cursor:wait}.login{width:min(470px,calc(100% - 28px));margin:12vh auto 0;padding:clamp(26px,5vw,48px);border:1px solid var(--line);background:rgba(38,11,18,.86);box-shadow:0 35px 100px #0008}.login h1{font-size:2.5rem;font-weight:400;margin:0 0 12px}.muted{color:var(--mut)}.field{display:grid;gap:7px;margin:18px 0}.field label,.section-label{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}input,textarea{width:100%;border:1px solid var(--line);background:#130509;color:var(--parch);padding:13px 14px;border-radius:0}textarea{min-height:128px;resize:vertical}.login .btn{width:100%;margin-top:10px}.app{padding:42px 0 90px}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:32px}.intro h1{font-size:clamp(2.2rem,5vw,4rem);font-weight:400;margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.tab{border:1px solid var(--line);background:#21080e;color:var(--mut);padding:12px 18px}.tab[aria-selected=true]{color:#1e070b;background:var(--gold);font-weight:700}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(49,14,22,.92),rgba(24,6,10,.94));padding:23px}.card h2{font-size:1.45rem;font-weight:400;margin:0 0 8px}.full{grid-column:1/-1}.photo{display:grid;grid-template-columns:180px 1fr;gap:23px;align-items:center}.photo img{width:180px;height:180px;object-fit:cover;border:1px solid var(--line);background:#100407}.photo input[type=file]{padding:10px}.status{min-height:26px;margin:16px 0;color:var(--mut)}.status.ok{color:var(--ok)}.status.error{color:var(--err)}.savebar{position:sticky;bottom:14px;display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:25px;padding:15px;border:1px solid var(--line);background:rgba(23,6,10,.94);backdrop-filter:blur(14px)}.noscript{margin:30px;padding:20px;background:#641c2a}.hidden{display:none!important}@media(max-width:760px){.top-in,.intro{align-items:flex-start;flex-direction:column;padding:18px 0}.grid{grid-template-columns:1fr}.full{grid-column:auto}.photo{grid-template-columns:1fr}.photo img{width:100%;height:230px}.savebar{align-items:stretch;flex-direction:column}.savebar .btn{width:100%}}
  </style>
</head>
<body>
  <noscript><div class="noscript">Pro bezpečnou administraci je potřeba JavaScript.</div></noscript>
  <section class="login" id="login" hidden>
    <span class="section-label">Chráněná sekce</span><h1>Administrace</h1><p class="muted">Přihlášení je chráněné omezením pokusů a zabezpečenou relací.</p>
    <form id="loginForm"><div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" value="info@vinidelite.cz" autocomplete="username" required></div><div class="field"><label for="loginPassword">Heslo</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn primary" id="loginButton">Přihlásit se</button><p class="status" id="loginStatus" role="status"></p></form>
  </section>
  <div id="app" hidden>
    <header class="top"><div class="shell top-in"><a class="brand" href="/" target="_blank" rel="noopener">Vini d’Elite</a><div class="actions"><a class="btn" href="/" target="_blank" rel="noopener">Otevřít web</a><button class="btn" id="logout">Odhlásit</button></div></div></header>
    <main class="shell app"><div class="intro"><div><span class="section-label">Správa webu</span><h1>Obsah a dokumenty</h1></div><p class="muted">Změny se publikují po uložení. Právní texty nechte před ostrým použitím zkontrolovat právníkem.</p></div>
      <div class="tabs" role="tablist"><button class="tab" aria-selected="true" data-tab="texts">Texty webu</button><button class="tab" aria-selected="false" data-tab="photos">Fotografie</button><button class="tab" aria-selected="false" data-tab="legal">GDPR a OP</button></div>
      <section class="panel active" data-panel="texts"><div class="grid" id="textGrid"></div></section>
      <section class="panel" data-panel="photos"><div class="grid" id="photoGrid"></div></section>
      <section class="panel" data-panel="legal"><div class="grid" id="legalGrid"></div></section>
      <div class="savebar"><span class="status" id="saveStatus" role="status" aria-live="polite"></span><button class="btn primary" id="save">Uložit a publikovat</button></div>
    </main>
  </div>
  <script>
  (function(){"use strict";
    var state=null,csrf="",dirty=false;
    var labels={
      "home.finderIntro":"Domů · úvod Najdi své víno","home.collectionIntro":"Domů · úvod kolekce","home.wineriesIntro":"Domů · úvod vinařství","home.regionsIntro":"Domů · úvod regionů","home.aboutTitle":"Domů · nadpis O konceptu","home.aboutLead":"Domů · úvod O konceptu","b2b.heroTitle":"B2B · hlavní nadpis","b2b.heroLead":"B2B · hlavní text","b2b.contactLead":"B2B · text u formuláře","prive.membershipIntro":"Privé · vysvětlení členství","prive.joinLead":"Privé · závěrečná výzva",
      "home.founder":"Domů · fotografie zakladatele","b2b.hero":"B2B · hlavní fotografie","prive.founder":"Privé · fotografie zakladatele",
      "wine.1":"Víno · San Lorenzo","wine.2":"Víno · La Cappelletta","wine.3":"Víno · Barbera d’Asti","wine.4":"Víno · Grignolino","wine.5":"Víno · Dolcetto","wine.6":"Víno · Freisa d’Asti","wine.7":"Víno · Cisterna d’Asti","wine.8":"Víno · Bric du Sivu","wine.9":"Víno · Mini Fior","wine.12":"Víno · Bonarda","wine.13":"Víno · Sant’Antonio","wine.14":"Víno · Santa Dorotea",
      gdpr:"Ochrana osobních údajů (GDPR)",terms:"Obchodní podmínky",cookies:"Zásady cookies",complaints:"Reklamační řád",shipping:"Doprava a předání"};
    var login=document.getElementById("login"),app=document.getElementById("app"),loginStatus=document.getElementById("loginStatus"),saveStatus=document.getElementById("saveStatus");
    function status(node,message,type){node.textContent=message||"";node.className="status"+(type?" "+type:"");}
    function request(url,options){options=options||{};options.credentials="same-origin";options.headers=Object.assign({Accept:"application/json"},options.headers||{});return fetch(url,options).then(function(response){return response.json().catch(function(){return{};}).then(function(data){if(!response.ok)throw new Error(data.error||"Požadavek se nepodařil.");return data;});});}
    function showLogin(){app.hidden=true;login.hidden=false;document.getElementById("loginPassword").focus();}
    function showApp(){login.hidden=true;app.hidden=false;}
    function textarea(key,value,legal){var card=document.createElement("article"),h=document.createElement("h2"),field=document.createElement("div"),area=document.createElement("textarea");card.className="card"+(legal?" full":"");h.textContent=labels[key]||key;field.className="field";area.value=value||"";area.rows=legal?14:6;area.dataset.key=key;area.dataset.group=legal?"legal":"texts";area.addEventListener("input",function(){state[this.dataset.group][this.dataset.key]=this.value;dirty=true;status(saveStatus,"Neuložené změny","");});field.appendChild(area);card.appendChild(h);card.appendChild(field);return card;}
    function render(){document.getElementById("textGrid").textContent="";document.getElementById("legalGrid").textContent="";document.getElementById("photoGrid").textContent="";Object.keys(state.texts).forEach(function(key){document.getElementById("textGrid").appendChild(textarea(key,state.texts[key],false));});Object.keys(state.legal).forEach(function(key){document.getElementById("legalGrid").appendChild(textarea(key,state.legal[key],true));});Object.keys(state.images).forEach(function(key){var card=document.createElement("article"),h=document.createElement("h2"),wrap=document.createElement("div"),img=document.createElement("img"),controls=document.createElement("div"),url=document.createElement("input"),file=document.createElement("input"),note=document.createElement("p");card.className="card full";wrap.className="photo";h.textContent=labels[key]||key;img.src=state.images[key];img.alt="Náhled";url.value=state.images[key];url.readOnly=true;file.type="file";file.accept="image/jpeg,image/png,image/webp";note.className="muted";note.textContent="JPG, PNG nebo WebP · nejvýše 8 MB. SVG není kvůli bezpečnosti povoleno.";file.addEventListener("change",function(){var selected=this.files&&this.files[0];if(!selected)return;upload(key,selected,file,img,url);});controls.appendChild(url);controls.appendChild(file);controls.appendChild(note);wrap.appendChild(img);wrap.appendChild(controls);card.appendChild(h);card.appendChild(wrap);document.getElementById("photoGrid").appendChild(card);});dirty=false;status(saveStatus,"Obsah načten","ok");}
    function load(){return request("/api/vini/admin/content").then(function(data){state=data.content;csrf=data.csrf;render();showApp();});}
    function upload(key,file,input,img,url){input.disabled=true;status(saveStatus,"Fotografii bezpečně nahrávám…","");var form=new FormData();form.append("file",file);request("/api/vini/admin/upload",{method:"POST",headers:{"X-Vini-CSRF":csrf},body:form}).then(function(data){state.images[key]=data.url;img.src=data.url;url.value=data.url;dirty=true;status(saveStatus,"Fotografie nahrána. Ještě uložte a publikujte změny.","ok");}).catch(function(error){status(saveStatus,error.message,"error");}).finally(function(){input.disabled=false;input.value="";});}
    document.getElementById("loginForm").addEventListener("submit",function(event){event.preventDefault();var button=document.getElementById("loginButton");button.disabled=true;status(loginStatus,"Ověřuji…","");request("/api/vini/admin/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("loginEmail").value,password:document.getElementById("loginPassword").value})}).then(function(data){csrf=data.csrf;document.getElementById("loginPassword").value="";return load();}).catch(function(error){status(loginStatus,error.message,"error");}).finally(function(){button.disabled=false;});});
    document.getElementById("save").addEventListener("click",function(){var button=this;button.disabled=true;status(saveStatus,"Ukládám a publikuji…","");request("/api/vini/admin/content",{method:"PUT",headers:{"Content-Type":"application/json","X-Vini-CSRF":csrf},body:JSON.stringify(state)}).then(function(data){state=data.content;dirty=false;status(saveStatus,"Uloženo a publikováno · "+new Date(state.updatedAt).toLocaleString("cs-CZ"),"ok");}).catch(function(error){status(saveStatus,error.message,"error");}).finally(function(){button.disabled=false;});});
    document.getElementById("logout").addEventListener("click",function(){request("/api/vini/admin/session",{method:"DELETE"}).finally(showLogin);});
    document.querySelectorAll(".tab").forEach(function(tab){tab.addEventListener("click",function(){document.querySelectorAll(".tab").forEach(function(item){item.setAttribute("aria-selected","false");});document.querySelectorAll(".panel").forEach(function(panel){panel.classList.remove("active");});this.setAttribute("aria-selected","true");document.querySelector('[data-panel="'+this.dataset.tab+'"]').classList.add("active");});});
    window.addEventListener("beforeunload",function(event){if(dirty){event.preventDefault();event.returnValue="";}});
    request("/api/vini/admin/session").then(function(data){csrf=data.csrf;return load();}).catch(showLogin);
  })();
  </script>
</body></html>
