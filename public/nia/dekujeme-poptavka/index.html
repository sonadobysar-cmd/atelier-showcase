<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/nia/favicon.svg?v=2" type="image/svg+xml">
<title>Děkujeme za poptávku — Nia Dobyšar</title>
<script src="/nia/google-ads.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--black:#080606;--cream:#f7f4f2;--burgundy3:#5c2a3e;--burgundy-glow:#9e4d6a;--display:'Bodoni Moda',Georgia,serif;--b:'Outfit',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:var(--black);color:#fff;font-family:var(--b);font-weight:300;padding:24px;text-align:center}
.panel{max-width:520px}
.eyebrow{font-size:.62rem;letter-spacing:.48em;text-transform:uppercase;color:rgba(158,77,106,.9);margin-bottom:18px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(2rem,6vw,2.8rem);letter-spacing:.04em;text-transform:uppercase;line-height:1.15;margin-bottom:16px}
p{color:rgba(255,255,255,.72);line-height:1.75;margin-bottom:28px}
a{display:inline-block;background:var(--burgundy3);color:#fff;text-decoration:none;font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;padding:16px 28px;border-radius:999px}
a:hover{background:var(--burgundy-glow)}
</style>
</head>
<body>
  <div class="panel">
    <p class="eyebrow">Poptávka odeslána ✦</p>
    <h1>Děkujeme</h1>
    <p>Zprávu jsem dostala. Ozvu se co nejdřív — obvykle do 24 hodin v pracovní dny.</p>
    <a href="/nia/">Zpět na web</a>
  </div>
<script src="/nia/cookie-bar.js" defer></script>
<script src="/nia/vercel-analytics.js" defer></script>
</body>
</html>
